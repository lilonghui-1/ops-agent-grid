# ============================================
# 运维 Agent 主配置文件
# ============================================

llm:
  provider: "openai"
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"    # 可选，本地模型时设置（如 http://localhost:8000/v1）
  model: "gpt-4"
  temperature: 0.1
  max_tokens: 4096

# 通知渠道配置
notify:
  wecom_webhook: "${WECOM_WEBHOOK}"       # 企业微信机器人 Webhook
  dingtalk_webhook: "${DINGTALK_WEBHOOK}"  # 钉钉机器人 Webhook

# 日志级别: DEBUG / INFO / WARNING / ERROR
log_level: "INFO"

# 数据库驱动版本管理
# 部署前请确保安装对应的数据库客户端和 Python 驱动
db_drivers:
  oracle:
    package: "oracledb"
    min_version: "2.0.0"
    client_required: false
    client_note: "纯 Python 驱动，Thin 模式无需安装 Oracle Instant Client"
    install_cmd: "pip install oracledb>=2.0.0"
  dm:
    package: "dmPython"
    min_version: "2.4.0"
    client_required: true
    client_note: "需要安装达梦数据库客户端，并设置 DM_HOME 环境变量"
    install_cmd: "pip install dmPython>=2.4.0  # 需从达梦官网下载 whl 包"
  kingbase:
    package: "ksycopg2"
    min_version: "2.8.0"
    client_required: false
    client_note: "纯 Python 驱动，无需额外客户端"
    install_cmd: "pip install ksycopg2>=2.8.0"

# 日志平台配置（可选）
# 支持通过 API 查询 ELK/Loki 等日志平台
log_platforms:
  # Elasticsearch 示例
  - name: "elasticsearch"
    type: "elasticsearch"
    url: "${ES_URL}"              # 如: http://elasticsearch:9200
    index: "logs-*"               # 日志索引模式
    username: "${ES_USERNAME}"    # 可选
    password: "${ES_PASSWORD}"    # 可选
  # Grafana Loki 示例
  - name: "loki"
    type: "loki"
    url: "${LOKI_URL}"            # 如: http://loki:3100

# 定时任务配置
schedule:
  inspection:
    cron: "0 */6 * * *"       # 每6小时巡检一次
    enabled: false             # 默认关闭，按需开启
  log_analysis:
    cron: "0 */2 * * *"       # 每2小时分析日志
    enabled: false

# ============================================
# Web 管理平台配置
# ============================================
web:
  host: "0.0.0.0"
  port: 8000
  secret_key: "${OPS_AGENT_SECRET_KEY}"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7
  default_admin: "admin"
  default_password: "admin123"

# 多模型 LLM 配置（Web 端 AI 对话使用）
llm_models:
  - name: "gpt-4"
    provider: "openai"
    api_key: "${OPENAI_API_KEY}"
    base_url: "${OPENAI_BASE_URL}"
    model: "gpt-4"
    temperature: 0.1
    max_tokens: 4096
  - name: "qwen-plus"
    provider: "openai"
    api_key: "${QWEN_API_KEY}"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    temperature: 0.1
    max_tokens: 4096
  - name: "deepseek-chat"
    provider: "openai"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    temperature: 0.1
    max_tokens: 4096

# 告警阈值
thresholds:
  cpu: 80
  memory: 85
  disk: 90

# IM 通道配置
channels:
  slack:
    webhook_url: "${SLACK_WEBHOOK_URL}"
    enabled: false
  dingtalk:
    webhook_url: "${DINGTALK_WEBHOOK}"
    secret: "${DINGTALK_SECRET}"
    enabled: true
  wecom:
    webhook_url: "${WECOM_WEBHOOK}"
    enabled: true
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    enabled: false
  lark:
    webhook_url: "${LARK_WEBHOOK_URL}"
    enabled: false

# Kubernetes 配置（可选）
kubernetes:
  kubeconfig: "${KUBECONFIG}"  # kubeconfig 文件路径，留空使用默认 ~/.kube/config
  in_cluster: false  # 是否在集群内运行

# 告警配置
alerts:
  auto_investigate: true  # 告警触发时自动启动事件调查
  webhook_token: "${ALERT_WEBHOOK_TOKEN}"  # 外部告警 Webhook 认证 token
  evaluation_interval: 60  # 告警规则评估间隔（秒）

# 审批配置
approval:
  auto_expire_hours: 24  # 审批请求自动过期时间
  require_for_risky: true  # 高风险操作需要审批

# 知识库 RAG 配置（可选）
knowledge_rag:
  enabled: false
  vector_db_path: "./data/chroma"
  embedding_model: "text-embedding-ada-002"
  chunk_size: 500
  chunk_overlap: 50

# 多模型路由（按 Agent 类型选择不同模型）
agent_models:
  coordinator:
    model: "gpt-4"
    temperature: 0.1
  specialist_sre:
    model: "gpt-4"
    temperature: 0.1
  specialist_network:
    model: "gpt-4"
    temperature: 0.1
  specialist_db:
    model: "gpt-4"
    temperature: 0.1
  specialist_compute:
    model: "gpt-4"
    temperature: 0.1
  incident_investigator:
    model: "gpt-4"
    temperature: 0.2
  reviewer:
    model: "gpt-4"
    temperature: 0.1
